<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Compra de Entradas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <h1>Simulador de Compra de Entradas</h1>
        <p>Este simulador te permite calcular el costo de entradas para un festival, aplicando descuentos según tu edad.</p>
        <button id="iniciar-simulador" class="btn btn-primary">Iniciar Simulador</button>

        <div id="caja-preguntas" class="mt-4" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Seleccioná tu tipo de entrada</h5>
                    <div id="opciones-entrada"></div>
                </div>
            </div>
        </div>

        <div id="consola-mensajes" class="mt-4" style="display: none;">
            <h3>Resultado de tu compra:</h3>
            <div id="resultado-compra"></div>
        </div>
    </div>
    <script src="js/simulador.js"></script>
</body>
</html>
